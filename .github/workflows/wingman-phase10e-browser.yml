name: Wingman Phase 10E Browser Acceptance
on:
  push:
    branches:
      - feature/v104-phase10e-combat-balance
      - feature/v105-banking-environment-hazards
  workflow_dispatch:

jobs:
  current-menu-desktop-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test current desktop and Android landscape menu and gameplay
        run: npx playwright test tests/browser/phase10e-campaign.spec.cjs tests/browser/phase11a-environment.spec.cjs --retries=0 --timeout=25000 --workers=2 --reporter=line
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase10e-browser-failures
          path: test-results/
          retention-days: 7
