<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d2b"><title>WINGMAN • Interactive Menu Prototype</title>
<meta name="description" content="Wingman - interactive WW2 poster-style menu prototype. No changes to the live game.">
<link rel="stylesheet" href="./prototype.css?v=4"></head>
<body>
<div id="app" class="app">
<header class="topbar">
 <button class="small-logo" data-screen="home" aria-label="Wingman home">WINGMAN</button>
 <nav class="topnav" aria-label="Main navigation">
 <button data-screen="home" data-nav="home">HOME</button>
 <button data-screen="operations" data-nav="operations">OPERATIONS</button>
 <button data-screen="aircraft" data-nav="aircraft">AIRCRAFT</button>
 <button data-screen="pilots" data-nav="pilots">PILOTS</button>
 <button data-screen="records" data-nav="records">STATS</button>
 </nav>
 <div class="top-right"><span class="wing-badge"><span class="wing">≋</span><i class="roundel"></i><span class="wing">≋</span></span><span class="squadron">SQUADRON<br><strong id="pilot-status">Guest Pilot</strong></span>
 <button class="gear" data-screen="options" title="Options" aria-label="Options">⚙</button></div>
</header>
<div class="prototype-note" role="status"><span class="dot"></span>INTERACTIVE DESIGN PROTOTYPE <span class="note-second">· All navigation is real · No live campaign or saved games are changed</span><a href="../" target="_blank" rel="noopener">CURRENT LIVE GAME ↗</a></div>
<main id="viewport" class="viewport" aria-live="polite"></main>
<div class="bottom-info"><span>ROYAL AIR FORCE &nbsp;✦&nbsp; FLY HIGH. FIGHT HARD.</span><span>WINGMAN / MENU DESIGN STUDY 01</span></div>
</div>
<script src="../src/data/pilot-roster.js"></script>
<script src="../assets/art/wingman-roster-32.js"></script>
<script src="../assets/art/wingman-german-painted-atlas.js"></script>
<script src="../assets/art/wingman-painted-atlas.js"></script>
<script src="./prototype.js?v=4"></script>
</body></html>
